# hoards/refrhus/eldr-sidecar.yaml — Refrhus's own Eldr side-car (house-specific thermal
# assumptions). Derived from eldr's generic example; refine as the house is measured.
design:
  indoor_heating_f: 70        # winter setpoint
  # outdoor_heating_99_f:     # omitted -> looked up from the model's lat/long (nearest station)
  supply_air_rise_f: 30       # CORRECTED 2026-09-02. Was 50, which is a GAS FURNACE number
  #                             # (furnaces deliver 120-140F supply). A heat pump delivers
  #                             # 95-105F against a 70F return, so ~30F rise — and therefore
  #                             # needs ~67% MORE airflow for the same heat. Verified against
  #                             # the pros' own reports: at 30F this model gives 370 CFM/ton
  #                             # against their 366 (progressions B and C both). At 50F it
  #                             # gave 222 CFM/ton, which is furnace territory and undersized
  #                             # every heating-driven duct in the house by a factor of 1.67.
  ground_temp_f: 50           # deep-soil temp. COOLING ONLY: below-grade surfaces face soil below the
  #                             # summer setpoint, so they are a heat sink and contribute no cooling load.
  #                             # Heating no longer uses this — below-grade walls + slab now take the full
  #                             # outdoor ΔT, with the soil path carried in their assembly U (Manual J).
infiltration:
  ach: 0.68                   # MEASURED. Blower door at the 2026-08 audit read 3,751 CFM50; over this
  #                             # model's 16,457 ft^3 conditioned volume that is 13.7 ACH50, and an LBL
  #                             # N-factor of ~20 (2 storeys, shielding class 4) gives 0.68 natural ACH.
  #                             # NOT the 0.85/0.44 in the pros' Progression A — those are a "Loose"
  #                             # tightness-class ESTIMATE, not a measurement. Their Progression C's
  #                             # 1,751 CFM50 / ACH 0.32 is a speculative post-air-sealing target.
assemblies:                   # U-value, BTU/(hr*ft^2*F), per surface category
  exterior_wall: 0.123        # MEASURED (pros' construction page, area-weighted over the three
  #                             # NON-garage above-grade rows): 247.9 ft^2 @ U-0.240 (2x4 stucco/siding,
  #                             # R-0 cavity / R-0 board — UNINSULATED) + 942.3 @ U-0.097 (R-11) +
  #                             # 130.5 @ U-0.091 (R-13), over 1,320.7 ft^2 -> 0.1233. Was 0.09, an
  #                             # "R-13-ish" guess that assumed the whole envelope is insulated —
  #                             # 247.9 ft^2 of it is not. The garage partition (222.0 ft^2 @ U-0.097)
  #                             # is EXCLUDED here; it is a buffer wall, declared below.
  #                             # LIMIT: one U house-wide, so this blend cannot say WHICH sections are
  #                             # the uninsulated ones, which distorts per-room loads.
  #                             # NO LONGER AN ENGINE LIMIT — Eldr resolves a U-value per surface.
  #                             # To split it: declare `exterior_wall/r0: 0.240` and
  #                             # `exterior_wall/r13: 0.091` here, then tag the walls with
  #                             # realms/realm-siliconsaga/sweethome3d/tag.py. What is missing is
  #                             # knowing which physical sections are the uninsulated 247.9 ft^2 —
  #                             # see schematic-hitlist.md item 1.4.
  buffer_wall: 0.097          # MEASURED (pros): "Garage Partition | 2x4 Wood Framed wall, Stucco/Siding
  #                             # - R-11 cavity / R-0 board", 222.0 ft^2 @ U-0.097 — a single row, so
  #                             # this is their measured value, not a blend. Was borrowing
  #                             # `exterior_wall`. NOTE: no effect until walls are tagged
  #                             # `{boundary: buffer}` in the `walls:` block below — nothing is today.
  basement_wall: 0.07         # EFFECTIVE below-grade U — the soil path is inside this number, and
  #                             # since the below-grade fix it is applied against the FULL outdoor
  #                             # ΔT (Manual J convention), not a ground ΔT.
  #                             # DELIBERATELY NOT UPDATED to the pros' values (bare 8" stone/brick
  #                             # U-0.293/0.297, finished R-11 U-0.088; area-weighted 0.196).
  #                             # Reason: Eldr has no grade line, so it classes the WHOLE basement
  #                             # wall as below-grade — ~1,135 ft^2 against their 774 ft^2, which
  #                             # they get by splitting each wall at grade and counting the rest as
  #                             # above-grade. Their U on our area gives 12,236 BTU/hr against their
  #                             # 9,271: a 32% overshoot replacing today's 53% undershoot. Trading
  #                             # one error for another is not accuracy. Resolve it properly with
  #                             # either the grade-line split, or measured wall surface temperatures
  #                             # (see hvac/index.md) — then this number can be set honestly.
  window: 0.588               # MEASURED (pros' construction page, area-weighted over all ten window
  #                             # rows / 152.5 ft^2 -> 89.72/152.5 = 0.5883). The glazing is a genuine
  #                             # MIX, not one product: 18.1 ft^2 clear single-pane @ U-0.900 (2 NE +
  #                             # 1 NW), 9.1 ft^2 single+storm @ U-0.570 (NW), and 125.3 ft^2 LowE
  #                             # double @ U-0.550/0.530 (the replaced ones). Was 0.30 — "double-pane",
  #                             # which described only the replacements.
  #                             # NOTE the 0.645 recorded in the Thalamus was wrong; the rows weight
  #                             # to 0.588. Window AREA needs no work — 146 ft^2 computed vs their 152.5.
  #                             # LIMIT: same as exterior_wall — one U house-wide cannot put the three
  #                             # single-pane windows in the rooms that actually have them, so per-room
  #                             # loads understate those rooms and overstate the rest.
  door: 0.40                  # HELD. The pros weight to 0.423 (21.5 ft^2 wood+storm @ U-0.280 +
  #                             # 17.4 ft^2 metal/fibreglass @ U-0.600) — near enough to 0.40 that
  #                             # changing it is noise. The door discrepancy is AREA, not U: our
  #                             # 2,908 BTU/hr implies ~132 ft^2 of door against their 82.3 (38.9
  #                             # opaque + 43.4 glass). ~50 ft^2 of phantom door lives in the model.
  ceiling: 0.057              # MEASURED (pros' construction page, area-weighted): 40.4 ft^2 R-11
  #                             # (U-0.081) + 541.2 R-13 (U-0.070) + 965.7 R-19 (U-0.049) over
  #                             # 1,547 ft^2 -> 0.0572. Was 0.026 (R-38) — that was aspirational.
  buffer_floor: 0.521         # MEASURED (pros): "passive floor exposed to outdoor air, no insul,
  #                             # tile or vinyl" over the crawlspace. Was borrowing `floor`'s slab
  #                             # 0.05 — wrong by 10x for a framed floor. Prime insulation target.
  floor: 0.020                # MEASURED (pros): "Bsmnt flr (> 2' below grade) - 32" short slab edge,
  #                             # no insul, any finish", 713.9 ft^2 @ U-0.020 — their basement slab,
  #                             # a single row. Effective below-grade value (soil path inside the
  #                             # number), applied at the full outdoor dT per Manual J. Was 0.05, a
  #                             # guess 2.5x too high; this is the one true-up that REDUCES our load.
equipment:
  existing_tons: 4.0          # current unit nominal tonnage
cooling:
  indoor_f: 75                # summer setpoint
  # outdoor_1_f:              # omitted -> looked up from lat/long
  shgc: 0.35                  # window solar heat gain coefficient
  occupants: 5                # for internal + latent gains. Actual headcount: 2 adults + 3 children
  #                             # (ages 2/5/7). Manual J does not scale a person by age, so all five
  #                             # count alike. Was 3. Matches the pros' 5, which they likely reached
  #                             # by the ACCA bedrooms+1 convention — the two methods agree here.
ducts:
  friction_rate: 0.08         # in.wc/100ft
  unit_name: air handler      # locates the placed air-handler furniture
  fitting_factor: 1.5         # straight length -> total effective length (rough)
  # available_static_pressure: 0.5   # set to DERIVE the friction rate (off by default)
spaces:                       # buffer-space temperature policies
  crawlspace:
    winter_temp_f: 32         # OBSERVED by the owner: not deliberately vented, but a crack to the
    #                           # outside and open into the garage; gets cold, not much below
    #                           # freezing on the coldest days. On a 70/15 design day that is a
    #                           # 0.67 factor. NOTE we differ from the pros here on purpose: they
    #                           # model this floor as "exposed to outdoor air" (full ΔT, factor 1.0,
    #                           # ~8,290 BTU/hr here); the observation says 5,765 is truer. Set
    #                           # `vented: true` to reproduce their treatment for comparison.
# walls:                      # optional per-wall boundary overrides (SH3D wall id); use --walls to list
#   wall-<id>: {boundary: buffer}     # garage/crawl-adjacent; 50% of ΔT
