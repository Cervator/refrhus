# Keep the generated documents in step with the model on `main`.
#
# `hvac/eldr-report.md` and `ducting-parts-list.md` are both derived from
# `Home.xml`. Regenerating them here means the site is never stale relative to
# the model, and a drifted figure shows up as a commit rather than as a review
# finding three sessions later.
name: Regenerate

on:
  push:
    branches: [main]
    paths:
      - 'sh3d-internals/**'
      - 'eldr-sidecar.yaml'
      - 'tools/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out the engine
        uses: actions/checkout@v4
        with:
          repository: SiliconSaga/eldr
          path: .eldr

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pyyaml defusedxml

      - name: Regenerate the load report
        env:
          PYTHONPATH: ${{ github.workspace }}/.eldr
        run: |
          {
            printf '<!-- GENERATED by eldr.cli — do not edit. Regenerate after any model or side-car change. -->\n\n'
            python -m eldr.cli sh3d-internals/Home.xml eldr-sidecar.yaml
          } > hvac/eldr-report.md

      - name: Regenerate the parts list
        env:
          PYTHONPATH: ${{ github.workspace }}/.eldr
        run: python tools/partslist.py

      - name: Commit if anything moved
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- hvac/eldr-report.md ducting-parts-list.md; then
            echo "generated documents already match the model"
            exit 0
          fi
          git add hvac/eldr-report.md ducting-parts-list.md
          git commit -m "regenerate the load report and parts list from the model

          Automated: the model or side-car changed on main and the generated
          documents no longer matched it."
          git push
