# A browsable copy of the site for every pull request, plus a visual diff
# against main. Publishes to gh-pages/pr-preview/pr-<n>/ and cleans up on close.
#
# This is what makes a documentation change reviewable: the diff shows that a
# table gained a column, the preview shows whether the column fits.
name: PR preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

# No workflow-level grants; the preview job declares exactly what it needs.
permissions: {}

# Shared with the deploy workflow — both write gh-pages, and a preview must not
# land mid-deploy.
concurrency:
  group: gh-pages-write
  cancel-in-progress: false
  # Without this only ONE run may sit pending in the group, so a second writer
  # arriving while a deploy is in flight silently replaces a third. `max` keeps
  # up to 100 queued — the difference between "previews are serialised" and
  # "some pull requests quietly never get one".
  queue: max

jobs:
  preview:
    # A `pull_request` from a fork gets a read-only token whatever the block
    # below asks for, so the publish and comment steps would fail rather than
    # do anything dangerous. Skipping the job outright turns a red X on every
    # outside contribution into a cleanly skipped check.
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      # Publish previews to gh-pages/pr-preview/<pr>/.
      contents: write
      # Upsert the sticky preview and visual-diff comments.
      pull-requests: write
      # Read the served Pages configuration (custom domain vs github.io) for
      # volundr's preview-coordinate derivation.
      pages: read
    uses: SiliconSaga/volundr/.github/workflows/pr-preview.yml@main
